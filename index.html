    const email='islamtogether.app@gmail.com';
    const languages={
      ar:{name:'العربية',dir:'rtl',privacy:'سياسة الخصوصية',railLabel:'التحكم في بياناتك',railTitle:'طلب حذف الحساب.',railText:'يمكنك حذف حسابك من التطبيق أو إرسال طلب إلينا إذا لم يعد التطبيق مثبتاً لديك.',kicker:'إدارة الحساب',title:'حذف الحساب والبيانات',lede:'يمكنك طلب حذف حسابك والبيانات المرتبطة به في أي وقت. اتبع الخطوات أدناه أو أرسل طلباً عبر البريد الإلكتروني.',sections:[['01','الحذف من التطبيق','إذا كان التطبيق مثبتاً لديك، فهذه أسرع طريقة:'],['02','طلب الحذف عبر الإنترنت','إذا لم تتمكن من استخدام التطبيق، أرسل طلباً من عنوان بريدك الإلكتروني المسجل. سنحتاج إلى هذا العنوان للتحقق من الحساب. لا ترسل كلمة المرور أو بيانات الدفع.'],['03','ما الذي سيُحذف؟','عند حذف الحساب، نحذف بيانات المصادقة والملف الشخصي وتقدم الصلاة والقرآن والصداقات المرتبطة بالحساب.'],['04','المساعدة','للاستفسارات حول الطلب، راسل <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.']],steps:['افتح إسلام توغيذر وسجّل الدخول إلى الحساب الذي تريد حذفه.','افتح الإعدادات ثم قسم الحساب.','اختر حذف الحساب واقرأ رسالة التأكيد.','أكد الحذف. سيُحذف الحساب والبيانات المرتبطة به.'],stepTitle:['افتح التطبيق','انتقل إلى الإعدادات','اختر حذف الحساب','أكد طلبك'],formIntro:'سيُفتح تطبيق البريد لديك مع رسالة جاهزة إلى فريق الدعم. راجعها وأرسلها لإتمام الطلب.',emailLabel:'البريد الإلكتروني المسجل في التطبيق',userLabel:'اسم المستخدم (اختياري)',typeLabel:'نوع الطلب',full:'حذف الحساب وجميع البيانات المرتبطة به',partial:'حذف بيانات محددة مع الإبقاء على الحساب',notesLabel:'تفاصيل إضافية (اختياري)',submit:'إنشاء رسالة طلب الحذف',status:'تم فتح تطبيق البريد. أرسل الرسالة لإيصال طلبك إلى فريق إسلام توغيذر.',phEmail:'name@example.com',phUser:'@username',phNotes:'اكتب أي تفاصيل تساعدنا في معالجة طلبك…',mailSubject:'طلب حذف حساب Islam Together'},
      de:{name:'Deutsch',dir:'ltr',privacy:'Datenschutz',railLabel:'Du behältst die Kontrolle',railTitle:'Kontolöschung beantragen.',railText:'Du kannst dein Konto in der App löschen oder uns eine Anfrage senden, wenn die App nicht mehr installiert ist.',kicker:'Kontoverwaltung',title:'Konto und Daten löschen',lede:'Du kannst jederzeit die Löschung deines Kontos und der zugehörigen Daten beantragen. Nutze die folgenden Schritte oder sende uns eine E-Mail.',sections:[['01','In der App löschen','Wenn die App installiert ist, geht es dort am schnellsten:'],['02','Löschanfrage im Web','Wenn du die App nicht nutzen kannst, sende die Anfrage von der E-Mail-Adresse, die in deinem Konto hinterlegt ist. Wir benötigen sie zur Zuordnung. Sende niemals dein Passwort oder Zahlungsdaten.'],['03','Welche Daten werden gelöscht?','Bei der Kontolöschung entfernen wir Authentifizierungsdaten, Profil, Gebets- und Koranfortschritt, Freundschaften, die mit dem Konto verbunden sind.'],['04','Hilfe','Bei Fragen zur Anfrage schreibe an <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.']],steps:['Öffne Islam Together und melde dich beim Konto an, das du löschen möchtest.','Öffne die Einstellungen und dann den Bereich Konto.','Wähle Konto löschen und lies den Bestätigungshinweis.','Bestätige die Löschung. Das Konto und die zugehörigen Daten werden entfernt.'],stepTitle:['App öffnen','Einstellungen öffnen','Konto löschen wählen','Anfrage bestätigen'],formIntro:'Dein E-Mail-Programm öffnet eine vorbereitete Nachricht an unser Support-Team. Prüfe sie und sende sie ab, um deine Anfrage einzureichen.',emailLabel:'E-Mail-Adresse des Kontos',userLabel:'Benutzername (optional)',typeLabel:'Art der Anfrage',full:'Konto und alle zugehörigen Daten löschen',partial:'Bestimmte Daten löschen, Konto behalten',notesLabel:'Weitere Angaben (optional)',submit:'Löschanfrage per E-Mail erstellen',status:'Dein E-Mail-Programm wurde geöffnet. Sende die Nachricht an das Islam-Together-Team.',phEmail:'name@beispiel.de',phUser:'@benutzername',phNotes:'Zusätzliche Angaben zu deiner Anfrage…',mailSubject:'Anfrage zur Kontolöschung bei Islam Together'},
      en:{name:'English',dir:'ltr',privacy:'Privacy policy',railLabel:'You stay in control',railTitle:'Request account deletion.',railText:'Delete your account in the app, or send us a request if you no longer have the app installed.',kicker:'Account management',title:'Account & data deletion',lede:'You can request deletion of your account and associated information at any time. Follow the steps below or send us a request by email.',sections:[['01','Delete in the app','If you still have the app installed, this is the quickest way:'],['02','Request deletion online','If you cannot use the app, send a request from the email address registered to your account. We need it to identify the account. Never send your password or payment details.'],['03','What will be deleted?','When your account is deleted, we remove its authentication details, profile, prayer and Quran progress, friendships.'],['04','Need help?','For questions about a request, email <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.']],steps:['Open Islam Together and sign in to the account you want to delete.','Open Settings, then go to the Account section.','Choose Delete account and read the confirmation prompt.','Confirm deletion. Your account and associated information will be removed.'],stepTitle:['Open the app','Go to Settings','Choose Delete account','Confirm your request'],formIntro:'Your email app will open a prepared message to our support team. Review and send it to submit your request.',emailLabel:'Email address registered to the account',userLabel:'Username (optional)',typeLabel:'Request type',full:'Delete my account and all associated information',partial:'Delete selected information and keep my account',notesLabel:'Additional details (optional)',submit:'Prepare deletion request email',status:'Your email app has opened. Send the message to submit your request to Islam Together.',phEmail:'you@example.com',phUser:'@username',phNotes:'Add details that may help us process your request…',mailSubject:'Islam Together account deletion request'},
      es:{name:'Español',dir:'ltr',privacy:'Política de privacidad',railLabel:'Tú mantienes el control',railTitle:'Solicita la eliminación.',railText:'Puedes borrar tu cuenta desde la app o enviarnos una solicitud si ya no la tienes instalada.',kicker:'Gestión de la cuenta',title:'Eliminación de cuenta y datos',lede:'Puedes solicitar en cualquier momento que eliminemos tu cuenta y la información asociada. Sigue estos pasos o envíanos una solicitud por correo.',sections:[['01','Eliminar desde la app','Si aún tienes la aplicación instalada, esta es la forma más rápida:'],['02','Solicitar la eliminación por web','Si no puedes usar la app, envía la solicitud desde el correo registrado en tu cuenta. Lo necesitamos para identificarla. No envíes tu contraseña ni datos de pago.'],['03','¿Qué se elimina?','Al eliminar la cuenta, borramos sus datos de autenticación, perfil, progreso de oración y Corán, amistades asociadas.'],['04','¿Necesitas ayuda?','Si tienes dudas sobre la solicitud, escribe a <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.']],steps:['Abre Islam Together e inicia sesión en la cuenta que quieres eliminar.','Abre Ajustes y entra en la sección Cuenta.','Elige Eliminar cuenta y lee el mensaje de confirmación.','Confirma la eliminación. Se borrarán tu cuenta y los datos asociados.'],stepTitle:['Abre la app','Ve a Ajustes','Elige Eliminar cuenta','Confirma la solicitud'],formIntro:'Se abrirá tu aplicación de correo con un mensaje preparado para soporte. Revísalo y envíalo para presentar la solicitud.',emailLabel:'Correo registrado en la cuenta',userLabel:'Nombre de usuario (opcional)',typeLabel:'Tipo de solicitud',full:'Eliminar mi cuenta y todos los datos asociados',partial:'Eliminar algunos datos y mantener mi cuenta',notesLabel:'Detalles adicionales (opcional)',submit:'Preparar solicitud por correo',status:'Se ha abierto tu aplicación de correo. Envía el mensaje para presentar la solicitud a Islam Together.',phEmail:'tu-correo@ejemplo.com',phUser:'@usuario',phNotes:'Añade detalles que puedan ayudarnos a tramitar la solicitud…',mailSubject:'Solicitud de eliminación de cuenta de Islam Together'},
      fr:{name:'Français',dir:'ltr',privacy:'Confidentialité',railLabel:'Vous gardez le contrôle',railTitle:'Demander la suppression.',railText:'Supprimez votre compte dans l’application ou envoyez-nous une demande si elle n’est plus installée.',kicker:'Gestion du compte',title:'Suppression du compte et des données',lede:'Vous pouvez demander à tout moment la suppression de votre compte et des informations associées. Suivez les étapes ou envoyez-nous une demande par e-mail.',sections:[['01','Supprimer dans l’application','Si l’application est installée, c’est le moyen le plus rapide :'],['02','Demande en ligne','Si vous ne pouvez pas utiliser l’application, envoyez la demande depuis l’adresse e-mail associée au compte. Elle nous permet de l’identifier. N’envoyez jamais votre mot de passe ni vos informations de paiement.'],['03','Quelles données seront supprimées ?','La suppression du compte efface les données d’authentification, le profil, la progression de prière et de lecture du Coran, les amitiés associées.'],['04','Besoin d’aide ?','Pour toute question, écrivez à <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.']],steps:['Ouvrez Islam Together et connectez-vous au compte à supprimer.','Ouvrez Paramètres, puis la section Compte.','Choisissez Supprimer le compte et lisez le message de confirmation.','Confirmez la suppression. Le compte et les informations associées seront effacés.'],stepTitle:['Ouvrir l’application','Aller dans Paramètres','Choisir Supprimer le compte','Confirmer la demande'],formIntro:'Votre application de messagerie ouvrira un message préparé pour notre assistance. Vérifiez-le et envoyez-le pour transmettre votre demande.',emailLabel:'Adresse e-mail associée au compte',userLabel:'Nom d’utilisateur (facultatif)',typeLabel:'Type de demande',full:'Supprimer mon compte et toutes les données associées',partial:'Supprimer certaines données et garder mon compte',notesLabel:'Informations complémentaires (facultatif)',submit:'Préparer la demande par e-mail',status:'Votre messagerie est ouverte. Envoyez le message à Islam Together pour transmettre la demande.',phEmail:'vous@exemple.fr',phUser:'@utilisateur',phNotes:'Ajoutez toute précision utile au traitement de votre demande…',mailSubject:'Demande de suppression du compte Islam Together'},
      it:{name:'Italiano',dir:'ltr',privacy:'Informativa privacy',railLabel:'Hai il controllo',railTitle:'Richiedi la cancellazione.',railText:'Puoi eliminare l’account dall’app o inviarci una richiesta se non è più installata.',kicker:'Gestione account',title:'Eliminazione account e dati',lede:'Puoi richiedere in qualsiasi momento l’eliminazione dell’account e delle informazioni associate. Segui i passaggi o inviaci una richiesta via e-mail.',sections:[['01','Elimina dall’app','Se l’app è ancora installata, questo è il modo più rapido:'],['02','Richiesta online','Se non puoi usare l’app, invia la richiesta dall’indirizzo e-mail registrato sull’account. Ci serve per identificarlo. Non inviare password o dati di pagamento.'],['03','Quali dati vengono eliminati?','Eliminando l’account rimuoviamo i dati di autenticazione, il profilo, i progressi di preghiera e Corano, le amicizie associate.'],['04','Serve aiuto?','Per domande sulla richiesta, scrivi a <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.']],steps:['Apri Islam Together e accedi all’account che vuoi eliminare.','Apri Impostazioni e poi la sezione Account.','Scegli Elimina account e leggi la richiesta di conferma.','Conferma l’eliminazione. L’account e i dati associati verranno rimossi.'],stepTitle:['Apri l’app','Vai a Impostazioni','Scegli Elimina account','Conferma la richiesta'],formIntro:'Si aprirà l’app di posta con un messaggio già preparato per l’assistenza. Controllalo e invialo per inoltrare la richiesta.',emailLabel:'E-mail registrata sull’account',userLabel:'Nome utente (facoltativo)',typeLabel:'Tipo di richiesta',full:'Elimina il mio account e tutti i dati associati',partial:'Elimina alcuni dati e mantieni l’account',notesLabel:'Dettagli aggiuntivi (facoltativo)',submit:'Prepara la richiesta via e-mail',status:'L’app di posta è stata aperta. Invia il messaggio per inoltrare la richiesta a Islam Together.',phEmail:'nome@esempio.it',phUser:'@utente',phNotes:'Aggiungi dettagli utili per elaborare la richiesta…',mailSubject:'Richiesta di eliminazione account Islam Together'},
      nl:{name:'Nederlands',dir:'ltr',privacy:'Privacybeleid',railLabel:'Jij houdt de controle',railTitle:'Verzoek om verwijdering.',railText:'Verwijder je account in de app of stuur ons een verzoek als de app niet meer is geïnstalleerd.',kicker:'Accountbeheer',title:'Account en gegevens verwijderen',lede:'Je kunt op elk moment vragen om je account en bijbehorende gegevens te verwijderen. Volg de stappen of stuur ons een e-mailverzoek.',sections:[['01','Verwijderen in de app','Als de app nog is geïnstalleerd, is dit de snelste manier:'],['02','Online een verzoek indienen','Kun je de app niet gebruiken? Stuur het verzoek dan vanaf het e-mailadres dat bij je account hoort. Zo kunnen we het account herkennen. Stuur nooit je wachtwoord of betaalgegevens.'],['03','Welke gegevens worden verwijderd?','Bij verwijdering wissen we de account- en aanmeldgegevens, het profiel, gebeds- en Koranvoortgang, vriendschappen.'],['04','Hulp nodig?','Mail vragen over je verzoek naar <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.']],steps:['Open Islam Together en meld je aan bij het account dat je wilt verwijderen.','Open Instellingen en ga naar Account.','Kies Account verwijderen en lees de bevestiging.','Bevestig de verwijdering. Je account en bijbehorende gegevens worden gewist.'],stepTitle:['Open de app','Ga naar Instellingen','Kies Account verwijderen','Bevestig je verzoek'],formIntro:'Je e-mailapp opent een vooraf opgesteld bericht aan ons supportteam. Controleer en verzend het om je verzoek in te dienen.',emailLabel:'E-mailadres van het account',userLabel:'Gebruikersnaam (optioneel)',typeLabel:'Type verzoek',full:'Mijn account en alle bijbehorende gegevens verwijderen',partial:'Geselecteerde gegevens verwijderen en account behouden',notesLabel:'Extra informatie (optioneel)',submit:'E-mail voor verwijderingsverzoek maken',status:'Je e-mailapp is geopend. Verzend het bericht om je verzoek bij Islam Together in te dienen.',phEmail:'jij@voorbeeld.nl',phU     const selector=document.getElementById('language');Object.entries(languages).forEach(([code,t])=>{const o=document.createElement('option');o.value=code;o.textContent=t.name;selector.append(o)});const pref=localStorage.getItem('it-language');const browser=(navigator.language||'es').slice(0,2);selector.value=languages[pref]?pref:(languages[browser]?browser:'es');
    function render(code){const t=languages[code];document.documentElement.lang=code;document.documentElement.dir=t.dir;document.querySelector('[data-i18n="privacyLink"]').textContent=t.privacy;document.getElementById('railLabel').textContent=t.railLabel;document.getElementById('railTitle').textContent=t.railTitle;document.getElementById('railText').textContent=t.railText;document.getElementById('document').innerHTML=`<header class="doc-head"><div class="eyebrow">${t.kicker}</div><h1>${t.title}</h1><p class="lede">${t.lede}</p></header><section class="section"><h2><span>${t.sections[0][0]}</span>${t.sections[0][1]}</h2><ol class="steps">${t.steps.map((step,i)=>`<li><span class="step-no">${i+1}</span><div><strong>${t.stepTitle[i]}</strong><span>${step}</span></div></li>`).join('')}</ol></section><section class="section"><h2><span>${t.sections[1][0]}</span>${t.sections[1][1]}</h2><p>${t.sections[1][2]}</p><div class="request"><p class="request-intro">${t.formIntro}</p><form id="requestForm"><div class="field"><label for="registeredEmail">${t.emailLabel} *</label><input id="registeredEmail" type="email" required autocomplete="email" placeholder="${t.phEmail}"></div><div class="field"><label for="username">${t.userLabel}</label><input id="username" type="text" autocomplete="username" placeholder="${t.phUser}"></div><div class="field"><label for="requestType">${t.typeLabel} *</label><select id="requestType" required><option value="${t.full}">${t.full}</option><option value="${t.partial}">${t.partial}</option></select></div><div class="field"><label for="notes">${t.notesLabel}</label><textarea id="notes" placeholder="${t.phNotes}"></textarea></div><button class="submit" type="submit">${t.submit}</button><div class="status" id="status" role="status" aria-live="polite">${t.status}</div></form></div></section>${t.sections.slice(2).map(([n,title,body])=>`<section class="section"><h2><span>${n}</span>${title}</h2><p>${body}</p></section>`).join('')}`;document.title=`${t.title} · Islam Together`;document.querySelector('.sr-only').textContent=({ar:'اختر اللغة',de:'Sprache auswählen',en:'Choose language',es:'Elige idioma',fr:'Choisir la langue',it:'Scegli la lingua',nl:'Kies taal',sq:'Zgjidh gjuhën',sr:'Izaberite jezik'})[code];selector.setAttribute('aria-label',document.querySelector('.sr-only').textContent);document.getElementById('requestForm').addEventListener('submit',event=>{event.preventDefault();const emailValue=document.getElementById('registeredEmail').value.trim();const username=document.getElementById('username').value.trim()||'—';const type=document.getElementById('requestType').value;const notes=document.getElementById('notes').value.trim()||'—';const subject=encodeURIComponent(t.mailSubject);const body=encodeURIComponent(`Application: Islam Together (com.islamtogether.app)\nRegistered email: ${emailValue}\nUsername: ${username}\nRequest: ${type}\nDetails: ${notes}\n`);document.getElementById('status').style.display='block';window.location.href=`mailto:${email}?subject=${subject}&body=${body}`});localStorage.setItem('it-language',code)}
    selector.addEventListener('change',()=>render(selector.value));render(selector.value);
